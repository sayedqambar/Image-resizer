server {
    listen       80;
    server_name  _;
    root         /usr/share/nginx/html;
    index        index.html;

    # Gzip static assets
    gzip            on;
    gzip_types      text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Cache hashed JS/CSS bundles aggressively; serve index.html without cache.
    location ~* \.(js|css|woff2?|png|svg|ico)$ {
        expires    1y;
        add_header Cache-Control "public, immutable";
    }

    # API proxy → Spring Boot backend
    # Override BACKEND_URL at container start with:
    #   docker run -e BACKEND_URL=http://your-backend:8080 ...
    # or, more commonly, use docker-compose to set the upstream via the service name.
    location /api/ {
        proxy_pass         http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        # Increase timeouts for AI calls (upscale can take several minutes on CPU)
        proxy_read_timeout  600s;
        proxy_connect_timeout 10s;
    }

    # SPA fallback: send all 404s to index.html so react-router handles them
    location / {
        try_files $uri $uri/ /index.html;
    }
}
